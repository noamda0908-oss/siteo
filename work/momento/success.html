<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>תודה על ההזמנה – MOMENTO</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0F1016;color:#F4EEE3;font-family:'Rubik',sans-serif;padding:24px;box-sizing:border-box;text-align:center}
.box{max-width:520px;animation:up .8s cubic-bezier(.2,.7,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.ok{width:96px;height:96px;border-radius:50%;background:#E2BE7E;display:flex;align-items:center;justify-content:center;margin:0 auto 26px;animation:pop .6s .2s both}
h1{font-size:clamp(32px,6vw,46px);font-weight:800;margin:0 0 14px;letter-spacing:-.02em}
p{color:#B9B3A8;line-height:1.7;font-size:18px;margin:0 0 10px}
.no{display:inline-block;margin:14px 0 26px;padding:10px 20px;border:1px solid #3A3B47;border-radius:999px}
.test{background:#2A2210;color:#E2BE7E;border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:20px}
a{display:inline-flex;min-height:44px;align-items:center;padding:14px 30px;border-radius:999px;background:#E2BE7E;color:#17130C;text-decoration:none;font-weight:700}
</style>
</head>
<body>
<div class="box">
<div class="ok"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#17130C" stroke-width="2.4" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
<div class="test" id="test" hidden>הזמנת בדיקה: לא בוצע חיוב, וההזמנה לא נשלחה לספק.</div>
<h1 id="h">תודה! ההזמנה התקבלה</h1>
<p>אנחנו כבר מתחילים לייצר את המתנה שלכם. אישור יישלח למייל, ותקבלו מספר מעקב ברגע שהחבילה יוצאת.</p>
<div class="no" id="no">מספר הזמנה: …</div><br>
<a href="./">חזרה לחנות</a>
</div>
<script>
const q=new URLSearchParams(location.search);if(q.get('test'))document.getElementById('test').hidden=false;
const id=q.get('o');
if(id)fetch('https://dndqljbibficfscylteq.supabase.co/functions/v1/momento-api',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'status',id})})
 .then(r=>r.json()).then(d=>{if(d.order_no){document.getElementById('no').textContent='מספר הזמנה: #'+(1000+d.order_no);if(d.first_name)document.getElementById('h').textContent='תודה '+d.first_name+'! ההזמנה התקבלה';}}).catch(()=>{});
</script>
</body>
</html>
