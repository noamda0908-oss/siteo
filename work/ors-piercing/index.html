<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Or's Piercing תור דיגיטלי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Frank+Ruhl+Libre:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: phone screen for the customer beside a tablet counter screen; one live queue feeds both */
  color-scheme: light;
  --blush:#FFF3F5;
  --paper:#FFFBFC;
  --wine:#330C0F;
  --wine-soft:#7A4B50;
  --rose:#E4A9B4;
  --rose-wash:#F9DDE2;
  --gold:#A9782B;
  --ok:#1F7A4D;
  --ok-wash:#DDF2E6;
  --line:rgba(51,12,15,.13);
  --display:"Frank Ruhl Libre","Times New Roman",serif;
  --body:"Assistant","Arial Hebrew",Arial,sans-serif;
  --r:18px;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--blush);color:var(--wine);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2.5px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* floating hoops background */
.hoops{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.hoops i{position:absolute;border-radius:50%;border:1.5px solid var(--rose);opacity:.55;animation:drift 18s ease-in-out infinite}
.hoops i::after{content:"";position:absolute;top:-5px;left:50%;width:8px;height:8px;border-radius:50%;background:var(--gold);transform:translateX(-50%)}
.hoops i:nth-child(1){width:220px;height:220px;top:-60px;left:-70px}
.hoops i:nth-child(2){width:120px;height:120px;top:38%;right:-40px;animation-delay:-6s}
.hoops i:nth-child(3){width:320px;height:320px;bottom:-140px;left:30%;animation-delay:-11s;opacity:.35}
@keyframes drift{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-22px) rotate(40deg)}}

.shell{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:16px 16px 90px;display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.top img{height:44px;width:auto;display:block}
.demo-tag{font-size:13px;color:var(--wine-soft);border:1px dashed var(--line);border-radius:99px;padding:4px 12px}

.switch{display:grid;grid-template-columns:1fr 1fr;background:var(--rose-wash);border-radius:99px;padding:4px;position:relative}
.switch button{padding:10px 8px;border-radius:99px;font-weight:700;position:relative;z-index:1;transition:color .3s}
.switch button[aria-selected="true"]{color:var(--blush)}
.switch::before{content:"";position:absolute;top:4px;bottom:4px;right:4px;width:calc(50% - 4px);background:var(--wine);border-radius:99px;transition:transform .45s cubic-bezier(.6,.1,.2,1)}
.switch[data-view="admin"]::before{transform:translateX(-100%)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gold);margin-inline-start:6px;animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.7);opacity:.4}}

.stage{display:grid;gap:20px}
.pane{display:none;animation:rise .55s cubic-bezier(.2,.8,.2,1)}
.stage[data-view="customer"] #customer,.stage[data-view="admin"] #admin{display:block}
@keyframes rise{from{transform:translateY(14px);opacity:.3}to{transform:none;opacity:1}}
.pane-label{font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--wine-soft);margin-bottom:8px}

/* customer phone */
.phone{background:var(--paper);border:1px solid var(--line);border-radius:32px;box-shadow:0 30px 60px -34px rgba(51,12,15,.55);max-width:420px;margin:0 auto;overflow:hidden;display:flex;flex-direction:column;min-height:580px}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.15;text-wrap:balance}
.p-head{position:relative;background:radial-gradient(120% 90% at 85% 0%,#5E1C24 0%,var(--wine) 62%);color:var(--blush);padding:24px 22px 52px;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.p-head>*{position:relative}
.p-head .hoop{position:absolute;width:190px;height:190px;border-radius:50%;border:1.5px solid rgba(228,169,180,.4);left:-64px;top:-56px;animation:spin 26s linear infinite}
.p-head .hoop::after{content:"";position:absolute;top:-6px;left:50%;width:11px;height:11px;margin-left:-5px;border-radius:50%;background:#E7C27A;box-shadow:0 0 14px #E7C27A}
.p-head .hoop.b{width:112px;height:112px;left:auto;right:-34px;top:auto;bottom:-10px;border-color:rgba(231,194,122,.45);animation-duration:18s;animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.logo-m{width:124px;aspect-ratio:560/255;background:var(--blush);-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat;margin-bottom:6px}
.p-head h1,.p-head h2{font-size:32px}
.p-head p{opacity:.82;font-size:16px}
.live{align-self:flex-start;display:inline-flex;gap:9px;align-items:center;background:rgba(255,243,245,.12);border:1px solid rgba(255,243,245,.24);border-radius:99px;padding:7px 15px;font-size:14.5px;margin-top:4px}
.live i{width:9px;height:9px;border-radius:50%;background:#5BE08F;animation:pulse 1.4s infinite;flex:none}
.p-head.mid{align-items:center;text-align:center;padding-bottom:62px}
.p-head.mid .logo-m{width:104px}
.p-head.mid h2{font-size:38px}
.p-head .tm{color:#F3D9A4;font-size:18px;margin-top:2px}
.radar{position:absolute!important;inset:0;display:grid;place-items:center;pointer-events:none}
.radar i{position:absolute;width:120px;height:120px;border-radius:50%;border:1.5px solid rgba(243,217,164,.55);animation:radar 2.7s ease-out infinite}
.radar i:nth-child(2){animation-delay:.9s}.radar i:nth-child(3){animation-delay:1.8s}
@keyframes radar{from{transform:scale(.4);opacity:.9}to{transform:scale(3.6);opacity:0}}
.fall{position:absolute!important;inset:0;pointer-events:none}
.fall i{position:absolute;top:-18px;width:12px;height:12px;border-radius:50%;border:2px solid #E7C27A;animation:fall 3.4s linear infinite}
.fall i:nth-child(odd){border-color:var(--rose);width:8px;height:8px}
@keyframes fall{to{transform:translateY(280px) rotate(220deg);opacity:0}}
.p-body{position:relative;background:var(--paper);border-radius:28px 28px 0 0;margin-top:-28px;padding:24px 20px;display:flex;flex-direction:column;gap:16px;flex:1}
.fresh .stag>*{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.fresh .stag>*:nth-child(2){animation-delay:.07s}.fresh .stag>*:nth-child(3){animation-delay:.14s}.fresh .stag>*:nth-child(4){animation-delay:.21s}.fresh .stag>*:nth-child(5){animation-delay:.28s}.fresh .stag>*:nth-child(n+6){animation-delay:.35s}
form{display:flex;flex-direction:column;gap:14px}
label.f{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:14px}
input[type=text],input[type=tel],input[type=number]{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:13px 16px;font-size:17px;width:100%;transition:border-color .2s,box-shadow .2s}
input:focus{border-color:var(--wine);box-shadow:0 0 0 4px var(--rose-wash);outline:0}
.fl{position:relative}
.fl input{height:60px;padding:24px 16px 8px}
.fl label{position:absolute;right:17px;top:19px;color:var(--wine-soft);pointer-events:none;transition:all .2s;font-size:16px}
.fl input:focus+label,.fl input:not(:placeholder-shown)+label{top:8px;font-size:12px;font-weight:700;color:var(--gold)}
.pick-t{font-weight:700;font-size:15px;display:block;margin-bottom:8px}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tcard{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:13px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;transition:all .28s cubic-bezier(.2,.9,.3,1.4);min-width:0}
.tcard .ic{width:22px;height:22px;border-radius:50%;border:2px solid var(--rose);position:relative;margin-bottom:3px;transition:border-color .2s}
.tcard .ic::after{content:"";position:absolute;top:-4px;left:50%;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:var(--gold)}
.tcard b{font-size:15px}
.tcard small{font-size:12.5px;color:var(--wine-soft)}
.tcard[aria-pressed="true"]{background:var(--wine);color:var(--blush);border-color:var(--wine);transform:translateY(-3px);box-shadow:0 14px 22px -14px var(--wine)}
.tcard[aria-pressed="true"] small{color:var(--rose)}
.tcard[aria-pressed="true"] .ic{border-color:#E7C27A}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:8px 15px;font-weight:600;transition:all .2s}
.chip[aria-pressed="true"]{background:var(--wine);color:var(--blush);border-color:var(--wine);transform:scale(1.04)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--wine-soft)}
.check input{width:20px;height:20px;accent-color:var(--wine);flex:none;margin-top:1px}
.btn{background:var(--wine);color:var(--blush);border-radius:99px;padding:15px 22px;font-weight:700;font-size:17px;width:100%;transition:transform .15s,box-shadow .2s;box-shadow:0 12px 24px -14px var(--wine);position:relative;overflow:hidden}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:scale(.98)}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.22) 50%,transparent 65%);transform:translateX(120%);animation:sheen 3.2s infinite}
@keyframes sheen{60%,100%{transform:translateX(-120%)}}
.btn.ghost{background:transparent;color:var(--wine);border:1.5px solid var(--wine);box-shadow:none}
.btn.ghost::after{display:none}
.btn.sm{padding:9px 16px;font-size:15px;width:auto}
.err{color:#A3231F;font-size:14px;font-weight:600}
.err:empty{display:none}
.trust{text-align:center;font-size:13px;color:var(--wine-soft)}
.ticket{background:#fff;border:1px solid var(--line);border-radius:24px;position:relative;overflow:hidden;box-shadow:0 20px 32px -26px rgba(51,12,15,.55)}
.t-top{padding:20px 16px 16px}
.perf{position:relative;border-top:2px dashed var(--line);margin:0 18px}
.perf::before,.perf::after{content:"";position:absolute;top:-12px;width:22px;height:22px;border-radius:50%;background:var(--paper);border:1px solid var(--line)}
.perf::before{right:-30px}.perf::after{left:-30px}
.t-meta{display:grid;grid-template-columns:repeat(3,1fr);padding:14px 8px 16px;text-align:center;gap:4px}
.t-meta.two{grid-template-columns:1fr 1fr}
.t-meta small{display:block;font-size:12px;color:var(--wine-soft)}
.t-meta b{font-family:var(--display);font-size:20px}
.ring-wrap{position:relative;width:186px;height:186px;margin:0 auto}
.ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--rose-wash);stroke-width:9}
.ring-fg{fill:none;stroke:var(--wine);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.3,.8,.2,1)}
.ring-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-in small{font-size:13px;color:var(--wine-soft)}
.ring-in b{font-family:var(--display);font-size:60px;line-height:1}
.ring-wrap .bead{position:absolute;top:-3px;left:50%;width:15px;height:15px;margin-left:-7.5px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 5px rgba(169,120,43,.2);animation:pulse 2s infinite}
.line{display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap}
.line span{font-size:12.5px;color:var(--wine-soft)}
.line i{width:11px;height:11px;border-radius:50%;background:var(--rose)}
.line i:first-of-type{animation:pulse 1.6s infinite}
.line em{font-style:normal;background:var(--gold);color:#fff;font-size:12.5px;font-weight:700;border-radius:99px;padding:2px 11px}
.note{background:var(--ok-wash);color:var(--ok);border-radius:14px;padding:11px 14px;font-size:14px;font-weight:600;text-align:center}
.linkbtn{color:var(--wine-soft);text-decoration:underline;font-size:14px;align-self:center;padding:6px}
.receipt{background:#fff;border:1px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0;padding:18px 18px 14px;font-size:15px;display:flex;flex-direction:column;gap:8px;position:relative;margin-bottom:8px}
.receipt::after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:8px;background:linear-gradient(135deg,#fff 50%,transparent 50%) 0 0/12px 8px,linear-gradient(225deg,#fff 50%,transparent 50%) 0 0/12px 8px}
.fresh .receipt{animation:print .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes print{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 -10px 0)}}
.receipt .row{display:flex;justify-content:space-between}
.receipt .tot{border-top:1px dashed var(--line);padding-top:8px;font-weight:700;font-size:18px}
.hint{font-size:13px;color:var(--wine-soft);border:1px dashed var(--line);border-radius:12px;padding:9px 12px;text-align:center;margin-top:auto}

/* admin */
.board{background:var(--paper);border:1px solid var(--line);border-radius:26px;padding:20px;box-shadow:0 24px 50px -30px rgba(51,12,15,.45);display:flex;flex-direction:column;gap:18px}
.board-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.board-head h2{font-size:26px}
.board-head p{color:var(--wine-soft);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--rose-wash);border-radius:var(--r);padding:12px 10px;text-align:center;min-width:0}
.stat b{font-family:var(--display);font-size:28px;display:block;line-height:1.1}
.stat span{font-size:12.5px;color:var(--wine-soft)}
.sec-title{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:15px;margin-bottom:8px}
.sec-title span{font-weight:400;color:var(--wine-soft);font-size:13px}
.rows{display:flex;flex-direction:column;gap:8px}
.row-c{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 12px;min-width:0}
.row-c.new{animation:slide .5s cubic-bezier(.2,.9,.3,1)}
@keyframes slide{from{transform:translateX(-30px);opacity:0}}
.row-c.now{border-color:var(--wine);box-shadow:inset 4px 0 0 var(--gold)}
.row-c.me{background:#FFF8EC}
.badge{width:42px;height:42px;border-radius:50%;background:var(--rose-wash);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:18px}
.now .badge{background:var(--wine);color:var(--blush)}
.who{min-width:0}
.who b{display:block;overflow-wrap:anywhere}
.who span{font-size:13px;color:var(--wine-soft)}
.pill{font-size:12.5px;font-weight:700;border-radius:99px;padding:4px 10px;white-space:nowrap}
.pill.ok{background:var(--ok-wash);color:var(--ok)}
.empty{color:var(--wine-soft);font-size:14px;text-align:center;padding:14px;border:1px dashed var(--line);border-radius:14px}
.tools{display:grid;grid-template-columns:1fr auto;gap:10px}
.qr{display:flex;gap:14px;align-items:center;border-top:1px dashed var(--line);padding-top:16px}
.qr canvas{width:92px;height:92px;border-radius:10px;border:1px solid var(--line);background:#fff;flex:none}
.qr p{font-size:14px;color:var(--wine-soft)}
.qr b{color:var(--wine);display:block;font-size:15px}

.who span[dir=ltr]{white-space:nowrap;display:inline-block}
.acts{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.tm{display:block;font-weight:700;color:var(--gold)}
.tm.late{color:#A3231F}
.note.warn{background:#FBEBD0;color:#7A5210;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.pill.warn{background:#FBEBD0;color:#7A5210;margin-inline-start:6px}
.care{background:var(--rose-wash);border-radius:var(--r);padding:14px 16px;font-size:14.5px}
.care b{display:block;margin-bottom:4px}
.care ul{padding-inline-start:18px;margin:0}
.care small{color:var(--wine-soft)}
.auto{border-top:1px dashed var(--line);padding-top:16px}
.auto ol{list-style:none;padding:0;display:flex;flex-direction:column;gap:6px;margin:0}
.auto li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;font-size:14px}
.auto li i{width:9px;height:9px;border-radius:50%;background:#25A55A;box-shadow:0 0 0 4px var(--ok-wash)}
.auto li span{color:var(--wine-soft)}
/* overlay + toast */
.overlay{position:fixed;inset:0;background:rgba(51,12,15,.45);backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center;z-index:20;padding:16px}
.overlay.open{display:flex}
.sheet{background:var(--paper);border-radius:26px;padding:22px;width:100%;max-width:440px;display:flex;flex-direction:column;gap:14px;animation:up .4s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(60px);opacity:0}}
.sheet h3{font-size:24px}
.amount{position:relative}
.amount input{font-family:var(--display);font-size:34px;font-weight:700;text-align:center;padding:10px}
.amount span{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:22px;color:var(--wine-soft)}
.toasts{position:fixed;bottom:16px;left:16px;right:16px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:30;pointer-events:none}
.toast{background:#fff;border:1px solid var(--line);border-inline-start:5px solid #25A55A;border-radius:14px;padding:10px 14px;max-width:440px;width:100%;box-shadow:0 16px 30px -18px rgba(51,12,15,.5);font-size:14px;animation:toast 4.6s forwards}
.toast b{display:block;font-size:12.5px;color:#1B7C43}
@keyframes toast{0%{transform:translateY(30px);opacity:0}8%,88%{transform:none;opacity:1}100%{transform:translateY(10px);opacity:0}}

@media (min-width:1000px){
  .switch{display:none}
  .stage{grid-template-columns:400px 1fr;align-items:start}
  .stage .pane{display:block!important}
  .overlay{align-items:center}
  .stats{grid-template-columns:repeat(3,1fr)}
  .stat b{font-size:34px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="hoops" aria-hidden="true"><i></i><i></i><i></i></div>

<script>
const LOGO = document.querySelector('.top img').src;
const TYPES = {'תנוך':120,'הליקס':180,'נזם':160,'טבור':220,'אחר':150}; // מחירים לדוגמה
const METHODS = ['אשראי','ביט','פייבוקס','מזומן'];
const MIN_PER = 8;
let nextNum = 48;
const mk = (name,phone,type,status,paid)=>({id:nextNum,num:nextNum++,name,phone,type,status,paid});
const S = {
  queue:[
    mk('שירה ל.','052-•••-4471','תנוך','done',{amount:120,method:'ביט'}),
    mk('מאיה כ.','054-•••-9020','נזם','done',{amount:160,method:'אשראי'}),
    mk('נועה ב.','050-•••-1183','הליקס','called'),
    mk('יעל ד.','053-•••-6612','טבור','waiting'),
    mk('רוני א.','058-•••-2390','תנוך','waiting'),
    mk('תמר ש.','052-•••-7754','הליקס','waiting'),
  ],
  me:null, form:{type:'תנוך'}, startAhead:1, seen:new Set(), cdot:false
};
const $ = s=>document.querySelector(s);
const esc = t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const WINDOW = 300; // שניות להגיע אחרי קריאה
const waiting = ()=>S.queue.filter(q=>q.status==='waiting');
const called = ()=>S.queue.filter(q=>q.status==='called');
const done = ()=>S.queue.filter(q=>q.status==='done');
const me = ()=>S.queue.find(q=>q.id===S.me);
const aheadOf = q=>waiting().findIndex(x=>x.id===q.id);
waiting().forEach(q=>q.warned=true);
called().forEach(q=>q.calledAt=Date.now()-70000);
function checkWarn(){
  waiting().forEach((q,i)=>{ if(i<=2&&!q.warned){ q.warned=true; if(q.id===S.me)S.cdot=true;
    if(i>0) toast('וואטסאפ נשלח אל '+q.name, (i===1?'עוד אחת לפנייך':'עוד '+i+' לפנייך')+' בתור ב‑Or\'s Piercing. כדאי להתקרב לדוכן.'); } });
}
function tick(){
  const now=Date.now();
  document.querySelectorAll('[data-t]').forEach(el=>{
    const left=Math.ceil(WINDOW-(now-+el.dataset.t)/1000), mine=el.dataset.mine;
    const mm=Math.floor(Math.max(0,left)/60)+':'+String(Math.max(0,left)%60).padStart(2,'0');
    el.textContent = left>0 ? (mine?'התור נשמר לך עוד ':'מחכים לה עוד ')+mm : (mine?'הזמן עבר, גשי לדוכן עכשיו':'עבר הזמן, אפשר לדלג');
    el.classList.toggle('late',left<=0);
  });
}
setInterval(tick,1000);

function toast(title,text){
  const d=document.createElement('div');d.className='toast';
  d.innerHTML='<b>'+esc(title)+'</b>'+esc(text);
  const T=$('#toasts');while(T.children.length>=2)T.firstChild.remove();T.appendChild(d);setTimeout(()=>d.remove(),4700);
}

/* ---------- customer ---------- */
document.documentElement.style.setProperty('--logo','url('+LOGO+')');
const first = n=>esc(n.split(' ')[0]);
const head = (inner,cls='')=>`<div class="p-head ${cls}"><span class="hoop" aria-hidden="true"></span><span class="hoop b" aria-hidden="true"></span><div class="logo-m" role="img" aria-label="Or's Piercing"></div>${inner}</div>`;
function renderPhone(){
  const m=me(), el=$('#phone'), st=m?m.status:'none';
  const old=$('#fname'); if(old){S.form.name=old.value;S.form.phone=$('#fphone').value;S.form.age=$('#fage').checked}
  el.classList.toggle('fresh',el.dataset.state!==st); el.dataset.state=st;
  let h='';
  if(!m){
    const w=waiting().length;
    h=head(`<h1>נכנסים לתור,<br>ממשיכים להסתובב</h1><p>נשלח לך וואטסאפ כשהתור שלך מתקרב</p>
      <div class="live"><i></i><span><b class="num">${w}</b> ממתינות עכשיו · כ‑<b class="num">${w*MIN_PER}</b> דקות</span></div>`)+
    `<div class="p-body"><form id="join" class="stag" novalidate>
      <div class="fl"><input id="fname" type="text" autocomplete="name" placeholder=" " value="${esc(S.form.name||'')}"><label for="fname">שם מלא</label></div>
      <div class="fl"><input id="fphone" type="tel" dir="ltr" inputmode="tel" placeholder=" " value="${esc(S.form.phone||'')}"><label for="fphone">טלפון לעדכון בוואטסאפ</label></div>
      <div><span class="pick-t">איזה פירסינג?</span><div class="tgrid">${Object.keys(TYPES).map(t=>`<button type="button" class="tcard" data-type="${t}" aria-pressed="${S.form.type===t}"><span class="ic"></span><b>${t}</b><small class="num">₪${TYPES[t]}</small></button>`).join('')}</div></div>
      <label class="check" for="fage"><input id="fage" type="checkbox" ${S.form.age?'checked':''}>אני מעל גיל 16, או שהגעתי עם הורה שיחתום על אישור</label>
      <div class="err" id="ferr" role="alert"></div>
      <button class="btn" type="submit">כניסה לתור</button>
      <p class="trust">בלי אפליקציה · בלי סיסמה · 20 שניות</p>
    </form></div>`;
  } else if(m.status==='waiting'){
    const a=aheadOf(m), prog=S.startAhead?1-a/(S.startAhead+1):1, C=2*Math.PI*92;
    h=head(`<p>מספר תור <b class="num">#${m.num}</b></p><h2>${first(m.name)}, את בתור</h2>`)+
    `<div class="p-body stag">
    <div class="ticket"><div class="t-top"><div class="ring-wrap"><svg viewBox="0 0 200 200"><circle class="ring-bg" cx="100" cy="100" r="92"/><circle class="ring-fg" cx="100" cy="100" r="92" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-Math.max(.06,prog))}"/></svg>
      <span class="bead"></span><div class="ring-in"><small>לפנייך בתור</small><b class="num">${a}</b><small>${a===0?'את הבאה':'כ‑'+(a*MIN_PER+4)+' דקות'}</small></div></div></div>
      <div class="perf"></div>
      <div class="t-meta"><div><small>מספר תור</small><b class="num">#${m.num}</b></div><div><small>פירסינג</small><b>${esc(m.type)}</b></div><div><small>מחיר</small><b class="num">₪${TYPES[m.type]}</b></div></div></div>
    <div class="line"><span>הדוכן</span>${'<i></i>'.repeat(Math.min(a,8))}<em>את</em></div>
    ${m.missed?'<div class="note warn">פספסת את התור הקודם. החזרנו אותך לתור</div>':''}
    ${a<=2?'<div class="note warn">עוד מעט תורך. כדאי להתקרב לדוכן</div>':'<div class="note">אפשר להסתובב בינתיים. נשלח לך וואטסאפ כשיישארו 2 לפנייך, ושוב כשיגיע התור</div>'}
    <button class="linkbtn" id="leave">יציאה מהתור</button>
    <div class="hint">בדמו: עברו למסך הניהול ולחצו "קראי לבאה בתור" כדי לקדם את התור</div></div>`;
  } else if(m.status==='called'){
    h=head(`<div class="radar" aria-hidden="true"><i></i><i></i><i></i></div><p>תור <b class="num">#${m.num}</b></p><h2>הגיע התור שלך</h2><p>אור מחכה לך בדוכן</p><span class="tm num" data-t="${m.calledAt}" data-mine="1"></span>`,'mid')+
    `<div class="p-body stag">
    <div class="ticket"><div class="t-meta two"><div><small>פירסינג</small><b>${esc(m.type)}</b></div><div><small>לתשלום בסיום</small><b class="num">₪${TYPES[m.type]}</b></div></div></div>
    <div class="note">משלמים בדוכן: אשראי, ביט, פייבוקס או מזומן</div>
    <div class="hint">בדמו: במסך הניהול לחצו "לתשלום" או "לא הגיעה" ליד השם שלך</div></div>`;
  } else {
    h=head(`<div class="fall" aria-hidden="true">${[8,22,37,51,66,80,92].map((x,i)=>`<i style="left:${x}%;animation-delay:${(i*.47).toFixed(2)}s"></i>`).join('')}</div><h2>תודה ${first(m.name)},<br>שיהיה במזל</h2><p>הקבלה נשלחה אלייך בוואטסאפ</p>`,'mid')+
    `<div class="p-body stag">
    <div class="receipt"><div class="row"><b>קבלה</b><span class="num">#${1000+m.num}</span></div>
      <div class="row"><span>פירסינג ${esc(m.type)}</span><span class="num">₪${m.paid.amount}</span></div>
      <div class="row"><span>אמצעי תשלום</span><span>${m.paid.method}</span></div>
      <div class="row tot"><span>סה"כ שולם</span><span class="num">₪${m.paid.amount}</span></div></div>
    <div class="care"><b>הוראות טיפול (נשלחו גם בוואטסאפ)</b><ul><li>לנקות פעמיים ביום בתמיסת מי מלח</li><li>לא לגעת בידיים לא נקיות</li><li>לא להחליף תכשיט עד להחלמה מלאה</li></ul><small>טקסט לדוגמה. אור תכתוב את ההוראות שלה</small></div>
    <div class="care"><b>מחר תקבלי הודעה</b>"איך מרגישה עם הפירסינג החדש? נשמח לביקורת ולעוקב באינסטגרם"</div>
    <button class="btn ghost" id="again">התחלה מחדש</button></div>`;
  }
  el.innerHTML=h;
}
$('#phone').addEventListener('click',e=>{
  const c=e.target.closest('.tcard');
  if(c){S.form.type=c.dataset.type;document.querySelectorAll('.tcard').forEach(x=>x.setAttribute('aria-pressed',x===c));return}
  if(e.target.id==='leave'){S.queue=S.queue.filter(q=>q.id!==S.me);S.me=null;checkWarn();render()}
  if(e.target.id==='again'){S.me=null;S.form={type:'תנוך'};render()}
});
$('#phone').addEventListener('submit',e=>{
  e.preventDefault();
  const name=$('#fname').value.trim(), phone=$('#fphone').value.trim(), err=$('#ferr');
  if(name.length<2){err.textContent='חסר שם. כתבי שם מלא כדי שנדע למי לקרוא';return}
  if(phone.replace(/\D/g,'').length<9){err.textContent='מספר הטלפון קצר מדי. צריך מספר מלא כדי לשלוח הודעה';return}
  if(!$('#fage').checked){err.textContent='צריך לסמן את אישור הגיל כדי להיכנס לתור';return}
  const q=mk(name,phone,S.form.type,'waiting');S.queue.push(q);S.me=q.id;S.startAhead=aheadOf(q);q.warned=S.startAhead<=2;
  render();toast('וואטסאפ נשלח אל '+name,'נכנסת לתור ב‑Or\'s Piercing. מספר '+q.num+', נעדכן כשיגיע התור.');
});

/* ---------- admin ---------- */
function rowHTML(q,kind){
  const isNew=!S.seen.has(q.id+kind);S.seen.add(q.id+kind);
  const cls=['row-c',kind==='called'?'now':'',q.id===S.me?'me':'',isNew?'new':''].join(' ');
  const act = kind==='waiting' ? `<button class="btn sm ghost" data-call="${q.id}">קראי</button>`
    : kind==='called' ? `<div class="acts"><button class="btn sm" data-pay="${q.id}">לתשלום</button><button class="btn sm ghost" data-miss="${q.id}">לא הגיעה</button></div>`
    : `<span class="pill ok num">₪${q.paid.amount} · ${q.paid.method}</span>`;
  return `<div class="${cls}"><div class="badge num">${q.num}</div><div class="who"><b>${esc(q.name)}${q.id===S.me?' (את, מהדמו)':''}</b><span>${esc(q.type)} · <span dir="ltr">${esc(q.phone)}</span>${kind==='waiting'&&q.warned?'<span class="pill warn">קיבלה התראה</span>':''}</span>${kind==='called'?`<span class="tm num" data-t="${q.calledAt}"></span>`:''}</div>${act}</div>`;
}
function renderBoard(){
  const w=waiting(), c=called(), d=done(), rev=d.reduce((s,q)=>s+q.paid.amount,0);
  const day=new Date().toLocaleDateString('he-IL',{weekday:'long',day:'numeric',month:'numeric'});
  $('#board').innerHTML=`
  <div class="board-head"><div><h2>התור של היום</h2><p>${day}</p></div><button class="btn sm ghost" id="addWalk">הוספה ידנית</button></div>
  <div class="stats"><div class="stat"><b class="num">${w.length}</b><span>ממתינות</span></div><div class="stat"><b class="num">${d.length}</b><span>טופלו היום</span></div><div class="stat"><b class="num">₪${rev.toLocaleString()}</b><span>הכנסות היום</span></div></div>
  <div><div class="sec-title">בטיפול עכשיו</div><div class="rows">${c.length?c.map(q=>rowHTML(q,'called')).join(''):'<div class="empty">אין אף אחת בטיפול. קראי לבאה בתור</div>'}</div></div>
  <button class="btn" id="callNext" ${w.length?'':'disabled style="opacity:.45"'}>קראי לבאה בתור ושלחי לה וואטסאפ</button>
  <div><div class="sec-title">ממתינות <span>לפי סדר הגעה</span></div><div class="rows">${w.length?w.map(q=>rowHTML(q,'waiting')).join(''):'<div class="empty">התור ריק</div>'}</div></div>
  <div><div class="sec-title">שולמו היום <span>קבלה נשלחה אוטומטית</span></div><div class="rows">${d.slice().reverse().map(q=>rowHTML(q,'done')).join('')}</div></div>
  <div class="auto"><div class="sec-title">הודעות וואטסאפ אוטומטיות <span>בלי לגעת בטלפון</span></div><ol>
    <li><i></i><div><b>נכנסת לתור</b> <span>מספר התור וזמן המתנה משוער</span></div></li>
    <li><i></i><div><b>עוד 2 לפנייך</b> <span>כדי שתספיק לחזור לדוכן</span></div></li>
    <li><i></i><div><b>הגיע התור שלך</b> <span>התור נשמר 5 דקות</span></div></li>
    <li><i></i><div><b>פספסת את התור</b> <span>כשמדלגים על מי שלא הגיעה</span></div></li>
    <li><i></i><div><b>קבלה והוראות טיפול</b> <span>מיד אחרי התשלום</span></div></li>
    <li><i></i><div><b>למחרת: בקשת ביקורת</b> <span>ועוקב באינסטגרם</span></div></li></ol></div>
  <div class="qr"><canvas id="qrc" width="230" height="230" aria-label="QR לדוגמה"></canvas><p><b>ה‑QR של הדוכן</b>מדפיסים ותולים. כל סריקה פותחת את דף ההרשמה לתור. (בדמו זה QR לדוגמה)</p></div>`;
  drawQR();
}
function callQ(id){
  const q=S.queue.find(x=>x.id===id);if(!q)return;q.status='called';q.calledAt=Date.now();
  if(id===S.me){S.cdot=true}
  render();toast('וואטסאפ נשלח אל '+q.name,'הגיע התור שלך ב‑Or\'s Piercing. התור נשמר לך 5 דקות.');checkWarn();render();
}
$('#board').addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.id==='callNext'){const n=waiting()[0];if(n)callQ(n.id)}
  else if(t.dataset.call)callQ(+t.dataset.call);
  else if(t.dataset.pay)openPay(+t.dataset.pay);
  else if(t.dataset.miss)openMiss(+t.dataset.miss);
  else if(t.id==='addWalk')openAdd();
});

/* ---------- sheets ---------- */
let pay={};
function openPay(id){
  const q=S.queue.find(x=>x.id===id);pay={id,method:'אשראי'};
  $('#sheet').innerHTML=`<h3>תשלום · ${esc(q.name)}</h3><p style="color:var(--wine-soft)">פירסינג ${esc(q.type)} · תור <span class="num">#${q.num}</span></p>
  <label class="f" for="pamt">סכום<div class="amount"><input id="pamt" type="number" inputmode="numeric" value="${TYPES[q.type]}"><span>₪</span></div></label>
  <div class="chips" id="pm">${METHODS.map(m=>`<button type="button" class="chip" data-m="${m}" aria-pressed="${m===pay.method}">${m}</button>`).join('')}</div>
  <div class="err" id="perr" role="alert"></div>
  <button class="btn" id="pok">סימון כשולם ושליחת קבלה</button><button class="btn ghost" id="pcancel">ביטול</button>`;
  $('#overlay').classList.add('open');
}
function openMiss(id){
  const q=S.queue.find(x=>x.id===id);pay={id};
  $('#sheet').innerHTML=`<h3>${esc(q.name)} לא הגיעה?</h3><p style="color:var(--wine-soft)">תור <span class="num">#${q.num}</span>. היא תקבל הודעה בוואטסאפ על מה שבחרת.</p>
  <button class="btn" id="mback">החזרה לתור, 2 מקומות אחורה</button><button class="btn ghost" id="mout">הוצאה מהתור</button><button class="btn ghost" id="pcancel">ביטול</button>`;
  $('#overlay').classList.add('open');
}
function openAdd(){
  pay={add:true,type:'תנוך'};
  $('#sheet').innerHTML=`<h3>הוספה ידנית לתור</h3>
  <label class="f" for="aname">שם<input id="aname" type="text" placeholder="שם הלקוחה"></label>
  <label class="f" for="aphone">טלפון<input id="aphone" type="tel" dir="ltr" placeholder="050-0000000"></label>
  <div class="chips" id="at">${Object.keys(TYPES).map(t=>`<button type="button" class="chip" data-t="${t}" aria-pressed="${t==='תנוך'}">${t}</button>`).join('')}</div>
  <div class="err" id="perr" role="alert"></div>
  <button class="btn" id="aok">הוספה לתור</button><button class="btn ghost" id="pcancel">ביטול</button>`;
  $('#overlay').classList.add('open');
}
const closeSheet=()=>$('#overlay').classList.remove('open');
$('#overlay').addEventListener('click',e=>{
  if(e.target.id==='overlay'||e.target.id==='pcancel')return closeSheet();
  const c=e.target.closest('.chip');
  if(c){[...c.parentNode.children].forEach(x=>x.setAttribute('aria-pressed',x===c));if(c.dataset.m)pay.method=c.dataset.m;if(c.dataset.t)pay.type=c.dataset.t;return}
  if(e.target.id==='pok'){
    const amt=Math.round(+$('#pamt').value);
    if(!(amt>0)){$('#perr').textContent='הסכום חייב להיות גדול מאפס';return}
    const q=S.queue.find(x=>x.id===pay.id);q.status='done';q.paid={amount:amt,method:pay.method};
    if(q.id===S.me)S.cdot=true;
    closeSheet();render();toast('קבלה והוראות טיפול נשלחו אל '+q.name,'קבלה #'+(1000+q.num)+' על ₪'+amt+' ('+pay.method+'). מצורפות הוראות טיפול בפירסינג.');
  }
  if(e.target.id==='mback'||e.target.id==='mout'){
    const q=S.queue.find(x=>x.id===pay.id);S.queue=S.queue.filter(x=>x!==q);
    if(e.target.id==='mback'){
      q.status='waiting';q.missed=true;q.warned=true;const w=waiting();
      if(w.length>=2)S.queue.splice(S.queue.indexOf(w[1])+1,0,q);else S.queue.push(q);
      if(q.id===S.me){S.cdot=true;S.startAhead=aheadOf(q)}
      toast('וואטסאפ נשלח אל '+q.name,'פספסת את התור ב‑Or\'s Piercing. החזרנו אותך לתור, נעדכן שוב כשיגיע.');
    } else {
      if(q.id===S.me){S.me=null;S.cdot=true}
      toast('וואטסאפ נשלח אל '+q.name,'התור שלך ב‑Or\'s Piercing בוטל כי לא הגעת. אפשר להירשם שוב ב‑QR.');
    }
    closeSheet();render();
  }
  if(e.target.id==='aok'){
    const name=$('#aname').value.trim();
    if(name.length<2){$('#perr').textContent='חסר שם ללקוחה';return}
    const nq=mk(name,$('#aphone').value.trim()||'ללא טלפון',pay.type,'waiting');S.queue.push(nq);nq.warned=aheadOf(nq)<=2;closeSheet();render();
  }
});

/* ---------- decorative sample QR ---------- */
function drawQR(){
  const cv=$('#qrc');if(!cv)return;const x=cv.getContext('2d'),n=23,s=10;x.fillStyle='#fff';x.fillRect(0,0,230,230);x.fillStyle='#330C0F';
  let seed=7;const r=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const eye=(a,b)=>a<7&&b<7||a<7&&b>=n-7||a>=n-7&&b<7;
  for(let i=0;i<n;i++)for(let j=0;j<n;j++)if(!eye(i,j)&&r()>.52)x.fillRect(j*s,i*s,s,s);
  [[0,0],[0,n-7],[n-7,0]].forEach(([i,j])=>{x.fillRect(j*s,i*s,70,70);x.fillStyle='#fff';x.fillRect(j*s+10,i*s+10,50,50);x.fillStyle='#330C0F';x.fillRect(j*s+20,i*s+20,30,30)});
}

/* ---------- view switch ---------- */
function setView(v){
  $('#switch').dataset.view=v;$('#stage').dataset.view=v;
  document.querySelectorAll('#switch button').forEach(b=>b.setAttribute('aria-selected',b.dataset.view===v));
  if(v==='customer'){S.cdot=false;$('#cdot').innerHTML=''}
}
$('#switch').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setView(b.dataset.view)});
function render(){
  renderPhone();renderBoard();tick();
  $('#cdot').innerHTML=(S.cdot&&$('#switch').dataset.view==='admin')?'<span class="dot"></span>':'';
}
render();
</script>
