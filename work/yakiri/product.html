<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>יקירי – מתנה בהתאמה אישית</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Suez+One&family=Noto+Serif+Hebrew:wght@400;500&family=Heebo:wght@300;400;500;700&family=Great+Vibes&display=swap" rel="stylesheet">
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/app.css">
<style>
.crumbs{font-size:14px;color:var(--soft);padding:28px 0}
.crumbs a:hover{color:var(--gold)}
.pd{display:grid;grid-template-columns:1.05fr 1fr;gap:64px;align-items:start}
.gal{position:sticky;top:100px}
.gal-main{aspect-ratio:1;overflow:hidden;background:var(--bg3);position:relative;border-radius:24px;border:1px solid var(--line)}
.gal-main>img,.gal-main>.mk{width:100%;height:100%;object-fit:cover;animation:zin .8s var(--ease) both}
@keyframes zin{from{opacity:0;transform:scale(1.05)}to{opacity:1;transform:none}}
.gal-main:after{content:"";position:absolute;inset:0;border-radius:24px;box-shadow:inset 0 0 80px rgba(0,0,0,.35);pointer-events:none}
.thumbs{display:flex;gap:12px;margin-top:14px}
.thumbs button{width:84px;height:84px;border-radius:14px;overflow:hidden;border:1px solid var(--line2);padding:0;cursor:pointer;background:var(--bg3);transition:.3s}
.thumbs button.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.thumbs .mini{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--gold2);line-height:1.3;text-align:center;padding:6px}
.info .for{color:var(--gold);font-size:13px;letter-spacing:.1em;margin-bottom:14px}
.info h1{font-size:clamp(36px,4vw,56px)}
.price{display:flex;align-items:baseline;gap:12px;margin:18px 0 4px;flex-wrap:wrap}
.price b{font-size:30px;font-weight:400;color:var(--gold2)}
.pnote{display:inline-flex;align-items:center;gap:8px;margin-top:8px;background:rgba(214,178,110,.1);border:1px solid var(--line);color:var(--gold2);border-radius:999px;padding:6px 14px;font-size:13.5px}
.info .lead{margin:18px 0 26px}
.box{border-top:1px solid var(--line);padding:26px 0 0;display:flex;flex-direction:column;gap:22px}
.lab{font-weight:400;font-size:15px;margin-bottom:12px;display:block;color:var(--text)}
.lab em{font-style:normal;color:var(--gold);font-family:var(--serif);font-size:18px;margin-inline-end:6px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{min-height:46px;min-width:58px;padding:8px 18px;border-radius:999px;border:1px solid var(--line);background:transparent;font:inherit;cursor:pointer;color:var(--text);transition:.3s}
.opt:hover{border-color:var(--gold)}
.opt.on{background:var(--goldg);color:#1A1208;border-color:transparent;font-weight:500}
.up{display:flex;align-items:center;gap:16px;border:1px dashed rgba(214,178,110,.45);border-radius:18px;padding:16px;cursor:pointer;transition:.3s;background:rgba(214,178,110,.03)}
.up:hover,.up.on{border-color:var(--gold);background:rgba(214,178,110,.08)}
.up .th{width:58px;height:58px;border-radius:12px;background:#1E1712 center/cover;flex:none;display:flex;align-items:center;justify-content:center;color:var(--gold)}
.up small{color:var(--soft)}
.box input[type=text]{width:100%;min-height:52px;padding:12px 18px;border-radius:14px;border:1px solid var(--line2);background:#17120D;font:inherit;font-size:16px;color:var(--text);transition:border-color .3s}
.box input[type=text]:focus{outline:0;border-color:var(--gold)}
.box input::placeholder{color:var(--mute)}
.buy{display:flex;gap:10px}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:999px}
.qty button{width:46px;height:52px;border:0;background:none;font-size:20px;cursor:pointer;color:var(--gold2)}
.qty span{min-width:24px;text-align:center;font-weight:500}
.buy .btn{flex:1}
.perks{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:26px;padding:22px;border:1px solid var(--line2);border-radius:18px;background:#0E0B08}
.perk{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--soft);line-height:1.55}
.perk svg{flex:none;color:var(--gold);margin-top:2px}
.perk b{color:var(--text);display:block;font-weight:500}
details{border-bottom:1px solid var(--line);padding:20px 0}
details summary{cursor:pointer;font-family:var(--serif);font-size:22px;list-style:none;display:flex;justify-content:space-between}
details summary::-webkit-details-marker{display:none}
details summary:after{content:"+";font-size:26px;color:var(--gold);font-family:Heebo;font-weight:300;transition:.3s}
details[open] summary:after{transform:rotate(45deg)}
details ul,details p{color:var(--soft);line-height:1.9;margin:12px 0 0;padding-inline-start:18px}
.notfound{text-align:center;padding:140px 20px}
.rel h2{margin-bottom:36px}
@media (max-width:900px){.pd{grid-template-columns:1fr;gap:30px}.gal{position:static}}
@media (max-width:640px){.thumbs button{width:70px;height:70px}.perks{grid-template-columns:1fr}.gal-main{border-radius:18px}}
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<section class="wrap rel" style="margin-top:110px;margin-bottom:120px">
<div class="eyebrow reveal">עוד רעיונות</div><h2 class="reveal">אולי יתאים <span class="gold">גם</span></h2>
<div class="grid" id="related"></div>
</section>
<script src="assets/app.js"></script>
<script>
const id=new URLSearchParams(location.search).get('id');
const p=P.find(x=>x.id===id);
const ck='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
if(!p){$('#app').innerHTML='<div class="notfound"><h1>המוצר לא נמצא</h1><p class="lead">אולי הוא כבר לא זמין.</p><a class="btn btn-primary" href="./#shop">לכל המתנות</a></div>';}
else{
document.title=p.name+' – יקירי';
const sel={};p.opts.forEach(o=>sel[o.name]=o.values[0]);
let qty=1,view='photo';
$('#app').innerHTML=`
<nav class="crumbs" aria-label="פירורי לחם"><a href="./">ראשי</a> / <a href="./?c=${p.c[0]}#shop">${LBL[p.c[0]]}</a> / <span>${esc(p.name)}</span></nav>
<div class="pd">
<div class="gal"><div class="gal-main" id="main"></div>
<div class="thumbs"><button class="on" data-v="photo" aria-label="תמונת המוצר"><img src="img/${p.id}.webp" alt=""></button>
${p.photo||p.m==='name'?`<button data-v="mock" aria-label="תצוגה עם התמונה שלכם"><span class="mini">${p.photo?'עם התמונה שלכם':'עם השם שלכם'}</span></button>`:''}</div></div>
<div class="info">
<div class="for">${p.c.map(x=>LBL[x]).join(' · ')}</div>
<h1>${esc(p.name)}</h1>
<div class="price"><b>₪${p.price}</b><span class="was">₪${p.was}</span></div><div id="pnote"></div>
<p class="lead">${esc(p.short)}</p>
<div class="box">
${p.photo?`<div><span class="lab"><em>1</em>העלו תמונה</span><label class="up" id="up" for="pfile"><span class="th" id="upth"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg></span><span><b id="uptxt" style="display:block">בחירת תמונה מהטלפון או מהמחשב</b><small style="color:var(--soft)">מומלץ: תמונה חדה, פנים ברורות</small></span></label><input type="file" id="pfile" accept="image/*" hidden></div>`:''}
${p.opts.map((o,i)=>`<div><span class="lab">${p.photo?`<em>${i+2}</em>`:''}${o.name}</span><div class="opts" data-o="${esc(o.name)}">${o.values.map((v,j)=>`<button class="opt${j?'':' on'}" data-v="${esc(v)}">${esc(v)}</button>`).join('')}</div></div>`).join('')}
${p.text?`<div><label class="lab" for="ptext">${esc(p.text)}</label><input type="text" id="ptext" maxlength="${p.m==='name'?10:40}" placeholder="${p.m==='name'?'Noa':'לדוגמה: אוהבים אותך'}" ${p.m==='name'?'dir="ltr"':''}></div>`:''}
<div class="buy"><div class="qty"><button id="qm" aria-label="הפחתה">−</button><span id="qn">1</span><button id="qp" aria-label="הוספה">+</button></div><button class="btn btn-primary" id="add">הוספה לסל · ₪${p.price}</button></div>
</div>
<div class="perks">
<div class="perk">${ck}<span><b>תצוגה לפני ייצור</b>רואים בדיוק מה מקבלים</span></div>
<div class="perk">${ck}<span><b>אריזת מתנה</b>מגיע מוכן לנתינה</span></div>
<div class="perk">${ck}<span><b>משלוח עד הבית</b>10–18 ימי עסקים, חינם מעל ₪199</span></div>
<div class="perk">${ck}<span><b>תשלום מאובטח</b>כרטיס אשראי</span></div>
</div>
<div style="margin-top:22px">
<details open><summary>פרטי המוצר</summary><ul>${p.details.map(d=>`<li>${esc(d)}</li>`).join('')}</ul></details>
<details><summary>משלוח</summary><p>כל מתנה מיוצרת במיוחד אחרי ההזמנה, ולכן זמן האספקה הוא 10–18 ימי עסקים עד הבית. מספר מעקב יישלח במייל ברגע שהחבילה יוצאת.</p></details>
<details><summary>החזרות</summary><p>מכיוון שהמוצר מותאם אישית, לא ניתן להחזיר אותו אחרי ייצור. אם המוצר הגיע פגום או שונה ממה שהזמנתם, נחליף אותו או נחזיר את הכסף.</p></details>
</div>
</div></div>`;

function show(){const m=$('#main');m.innerHTML=view==='photo'?`<img src="img/${p.id}.webp" alt="${esc(p.name)}" width="900" height="900">`:mock(p.m,$('#ptext')?.value);
 document.querySelectorAll('.thumbs button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));}
document.querySelector('.thumbs').addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(b){view=b.dataset.v;show();}});
document.querySelectorAll('.opts').forEach(g=>g.addEventListener('click',e=>{const b=e.target.closest('.opt');if(!b)return;g.querySelectorAll('.opt').forEach(x=>x.classList.toggle('on',x===b));sel[g.dataset.o]=b.dataset.v;}));
function markUploaded(){if(!$('#up'))return;$('#up').classList.add('on');$('#upth').style.backgroundImage='var(--photo)';$('#upth').innerHTML='';$('#uptxt').textContent='התמונה הועלתה ✓ (לחצו להחלפה)';}
if(p.photo){$('#pfile').addEventListener('change',e=>setPhoto(e.target.files[0],()=>{markUploaded();view='mock';show();toast('התמונה הועלתה');}));
 try{if(sessionStorage.getItem('yk_photo'))markUploaded();}catch(e){}}
$('#ptext')?.addEventListener('input',e=>{if(p.m==='name'){e.target.value=e.target.value.replace(/[^A-Za-z ]/g,'');}if(p.m==='name'||p.m==='plaque'){view='mock';show();}});
$('#qm').onclick=()=>{qty=Math.max(1,qty-1);upd();};$('#qp').onclick=()=>{qty=Math.min(10,qty+1);upd();};
function upd(){$('#qn').textContent=qty;$('#add').textContent=`הוספה לסל · ₪${p.price*qty}`;}
$('#add').addEventListener('click',async()=>{
 const text=$('#ptext')?.value.trim()||'';
 if(p.photo&&!PHOTO.file){toast('קודם בוחרים תמונה');$('#pfile').click();return;}
 if(p.required&&!text){toast('נא לכתוב את השם');$('#ptext').focus();return;}
 const b=$('#add');b.disabled=true;b.innerHTML='<span class="spin"></span>';
 try{
  const path=p.photo?await uploadPhoto():null;
  const parts=[...Object.entries(sel).map(([k,v])=>`${k}: ${v}`),text&&`טקסט: ${text}`].filter(Boolean);
  addToCart({id:p.id,name:p.name,price:p.price,qty,text:parts.join(' · '),photo_path:path,thumb:p.photo?PHOTO.thumb:null});
 }catch(e){toast('העלאת התמונה נכשלה, נסו שוב');}
 b.disabled=false;upd();
});
show();
onPromo(pr=>{$('#pnote').innerHTML=`<span class="pnote">✦ ${esc(pr.label||'מבצע')}: עוד ${pr.pct}% הנחה בסל · ${money(p.price*(100-pr.pct)/100)}</span>`;});
$('#related').innerHTML=P.filter(x=>x.id!==p.id&&x.c.some(c=>p.c.includes(c))).slice(0,4).map(card).join('');
}
observe();
</script>
</body>
</html>
