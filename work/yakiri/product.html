<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>יקירי – מתנה בהתאמה אישית</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&family=Great+Vibes&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<style>
.crumbs{font-size:14px;color:var(--soft);padding:22px 0}
.crumbs a:hover{color:var(--accent)}
.pd{display:grid;grid-template-columns:1.1fr 1fr;gap:56px;align-items:start}
.gal{position:sticky;top:96px}
.gal-main{aspect-ratio:4/5;overflow:hidden;background:var(--sand);position:relative}
.gal-main>img,.gal-main>.mk{width:100%;height:100%;object-fit:cover;animation:up .5s both}
.thumbs{display:flex;gap:12px;margin-top:14px}
.thumbs button{width:76px;height:95px;border-radius:0;overflow:hidden;border:2px solid transparent;padding:0;cursor:pointer;background:var(--sand)}
.thumbs button.on{border-color:var(--ink)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.thumbs .mini{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;color:var(--ink);background:var(--sand);line-height:1.3;text-align:center;padding:6px}
.info .for{color:var(--soft);font-size:14px;margin-bottom:10px}
.info h1{font-size:clamp(28px,3.2vw,40px)}
.price{display:flex;align-items:baseline;gap:12px;margin:16px 0 6px}
.price b{font-size:26px;font-weight:500}
.save{color:var(--accent);font-size:14px}
.info .lead{margin:14px 0 24px}
.box{border-top:1px solid var(--line);padding:22px 0 0;display:flex;flex-direction:column;gap:18px}
.lab{font-weight:500;font-size:15px;margin-bottom:10px;display:block}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{min-height:44px;min-width:56px;padding:8px 16px;border-radius:2px;border:1px solid var(--line);background:#fff;font:inherit;font-weight:400;cursor:pointer;color:var(--ink)}
.opt.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.up{display:flex;align-items:center;gap:14px;border:1px dashed #BDB4A9;border-radius:2px;padding:14px;cursor:pointer;transition:.25s}
.up:hover,.up.on{border-color:var(--ink);background:var(--sand)}
.up .th{width:52px;height:52px;background:var(--sand) center/cover;flex:none;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.box input[type=text]{width:100%;min-height:50px;padding:12px 16px;border-radius:2px;border:1px solid var(--line);background:#fff;font:inherit;font-size:16px;color:var(--ink)}
.buy{display:flex;gap:10px}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:2px;background:#fff}
.qty button{width:44px;height:48px;border:0;background:none;font-size:20px;cursor:pointer;color:var(--ink)}
.qty span{min-width:24px;text-align:center;font-weight:600}
.buy .btn{flex:1}
.perks{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.perk{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--soft);line-height:1.5}
.perk svg{flex:none;color:var(--ink);margin-top:2px}
.perk b{color:var(--ink);display:block}
details{border-bottom:1px solid var(--line);padding:18px 0}
details summary{cursor:pointer;font-weight:500;font-size:17px;list-style:none;display:flex;justify-content:space-between}
details summary:after{content:"+";font-size:22px;color:var(--ink);transition:.3s}
details[open] summary:after{transform:rotate(45deg)}
details ul,details p{color:var(--soft);line-height:1.8;margin:12px 0 0;padding-inline-start:18px}
.notfound{text-align:center;padding:120px 20px}
@media (max-width:900px){.pd{grid-template-columns:1fr;gap:28px}.gal{position:static}}
@media (max-width:640px){.thumbs button{width:68px;height:68px}.perks{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<section class="wrap" style="margin-top:90px">
<h2 class="reveal" style="margin-bottom:28px">אולי יתאים לכם גם</h2>
<div class="grid" id="related"></div>
</section>
<script src="assets/app.js"></script>
<script>
const id=new URLSearchParams(location.search).get('id');
const p=P.find(x=>x.id===id);
const ck='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
if(!p){$('#app').innerHTML='<div class="notfound"><h1>המוצר לא נמצא</h1><p class="lead">אולי הוא כבר לא זמין.</p><a class="btn btn-primary" href="./#shop">לכל המתנות</a></div>';}
else{
document.title=p.name+' – יקירי';
const sel={};p.opts.forEach(o=>sel[o.name]=o.values[0]);
let qty=1,view='photo';
$('#app').innerHTML=`
<nav class="crumbs" aria-label="פירורי לחם"><a href="./">ראשי</a> / <a href="./?c=${p.c[0]}#shop">${LBL[p.c[0]]}</a> / <span>${esc(p.name)}</span></nav>
<div class="pd">
<div class="gal"><div class="gal-main" id="main"></div>
<div class="thumbs"><button class="on" data-v="photo" aria-label="תמונת המוצר"><img src="img/${p.id}.webp" alt=""></button>
${p.photo||p.m==='name'?`<button data-v="mock" aria-label="תצוגה עם התמונה שלכם"><span class="mini">${p.photo?'עם התמונה שלכם':'עם השם שלכם'}</span></button>`:''}</div></div>
<div class="info">
<div class="for">${p.c.map(x=>LBL[x]).join(' · ')}</div>
<h1>${esc(p.name)}</h1>
<div class="price"><b>₪${p.price}</b><span class="was">₪${p.was}</span></div>
<p class="lead">${esc(p.short)}</p>
<div class="box">
${p.photo?`<div><span class="lab">1. העלו תמונה</span><label class="up" id="up" for="pfile"><span class="th" id="upth"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg></span><span><b id="uptxt" style="display:block">בחירת תמונה מהטלפון או מהמחשב</b><small style="color:var(--soft)">מומלץ: תמונה חדה, פנים ברורות</small></span></label><input type="file" id="pfile" accept="image/*" hidden></div>`:''}
${p.opts.map((o,i)=>`<div><span class="lab">${p.photo?i+2+'. ':''}${o.name}</span><div class="opts" data-o="${esc(o.name)}">${o.values.map((v,j)=>`<button class="opt${j?'':' on'}" data-v="${esc(v)}">${esc(v)}</button>`).join('')}</div></div>`).join('')}
${p.text?`<div><label class="lab" for="ptext">${esc(p.text)}</label><input type="text" id="ptext" maxlength="${p.m==='name'?10:40}" placeholder="${p.m==='name'?'Noa':'לדוגמה: אוהבים אותך'}" ${p.m==='name'?'dir="ltr"':''}></div>`:''}
<div class="buy"><div class="qty"><button id="qm" aria-label="הפחתה">−</button><span id="qn">1</span><button id="qp" aria-label="הוספה">+</button></div><button class="btn btn-primary" id="add">הוספה לסל · ₪${p.price}</button></div>
</div>
<div class="perks">
<div class="perk">${ck}<span><b>תצוגה לפני ייצור</b>רואים בדיוק מה מקבלים</span></div>
<div class="perk">${ck}<span><b>אריזת מתנה</b>מגיע מוכן לנתינה</span></div>
<div class="perk">${ck}<span><b>משלוח עד הבית</b>10–18 ימי עסקים, חינם מעל ₪199</span></div>
<div class="perk">${ck}<span><b>תשלום מאובטח</b>כרטיס אשראי</span></div>
</div>
<div style="margin-top:22px">
<details open><summary>פרטי המוצר</summary><ul>${p.details.map(d=>`<li>${esc(d)}</li>`).join('')}</ul></details>
<details><summary>משלוח</summary><p>כל מתנה מיוצרת במיוחד אחרי ההזמנה, ולכן זמן האספקה הוא 10–18 ימי עסקים עד הבית. מספר מעקב יישלח במייל ברגע שהחבילה יוצאת.</p></details>
<details><summary>החזרות</summary><p>מכיוון שהמוצר מותאם אישית, לא ניתן להחזיר אותו אחרי ייצור. אם המוצר הגיע פגום או שונה ממה שהזמנתם, נחליף אותו או נחזיר את הכסף.</p></details>
</div>
</div></div>`;

function show(){const m=$('#main');m.innerHTML=view==='photo'?`<img src="img/${p.id}.webp" alt="${esc(p.name)}" width="900" height="900">`:mock(p.m,$('#ptext')?.value);
 document.querySelectorAll('.thumbs button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));}
document.querySelector('.thumbs').addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(b){view=b.dataset.v;show();}});
document.querySelectorAll('.opts').forEach(g=>g.addEventListener('click',e=>{const b=e.target.closest('.opt');if(!b)return;g.querySelectorAll('.opt').forEach(x=>x.classList.toggle('on',x===b));sel[g.dataset.o]=b.dataset.v;}));
function markUploaded(){if(!$('#up'))return;$('#up').classList.add('on');$('#upth').style.backgroundImage='var(--photo)';$('#upth').innerHTML='';$('#uptxt').textContent='התמונה הועלתה ✓ (לחצו להחלפה)';}
if(p.photo){$('#pfile').addEventListener('change',e=>setPhoto(e.target.files[0],()=>{markUploaded();view='mock';show();toast('התמונה הועלתה');}));
 try{if(sessionStorage.getItem('yk_photo'))markUploaded();}catch(e){}}
$('#ptext')?.addEventListener('input',e=>{if(p.m==='name'){e.target.value=e.target.value.replace(/[^A-Za-z ]/g,'');}if(p.m==='name'||p.m==='plaque'){view='mock';show();}});
$('#qm').onclick=()=>{qty=Math.max(1,qty-1);upd();};$('#qp').onclick=()=>{qty=Math.min(10,qty+1);upd();};
function upd(){$('#qn').textContent=qty;$('#add').textContent=`הוספה לסל · ₪${p.price*qty}`;}
$('#add').addEventListener('click',async()=>{
 const text=$('#ptext')?.value.trim()||'';
 if(p.photo&&!PHOTO.file){toast('קודם בוחרים תמונה');$('#pfile').click();return;}
 if(p.required&&!text){toast('נא לכתוב את השם');$('#ptext').focus();return;}
 const b=$('#add');b.disabled=true;b.innerHTML='<span class="spin"></span>';
 try{
  const path=p.photo?await uploadPhoto():null;
  const parts=[...Object.entries(sel).map(([k,v])=>`${k}: ${v}`),text&&`טקסט: ${text}`].filter(Boolean);
  addToCart({id:p.id,name:p.name,price:p.price,qty,text:parts.join(' · '),photo_path:path,thumb:p.photo?PHOTO.thumb:null});
 }catch(e){toast('העלאת התמונה נכשלה, נסו שוב');}
 b.disabled=false;upd();
});
show();
$('#related').innerHTML=P.filter(x=>x.id!==p.id&&x.c.some(c=>p.c.includes(c))).slice(0,4).map(card).join('');
}
observe();
</script>
</body>
</html>
