<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>תודה על ההזמנה – יקירי</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Suez+One&family=Heebo:wght@300;400;500&display=swap" rel="stylesheet">
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,#22190F,#0A0806 70%);color:#EFE7DA;font-family:'Heebo',sans-serif;font-weight:300;padding:24px;box-sizing:border-box;text-align:center}
.box{max-width:560px;animation:up 1s cubic-bezier(.2,.7,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(0) rotate(-20deg)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
.ok{width:110px;height:132px;margin:0 auto 26px;animation:pop .9s .2s both;filter:drop-shadow(0 0 30px rgba(214,178,110,.5))}
h1{font-family:'Suez One',serif;font-weight:400;font-size:clamp(40px,7vw,64px);margin:0 0 16px;background:linear-gradient(100deg,#8E6B2E,#E9CD8A 30%,#FFF1C4 45%,#D4AF6A 62%,#8A6A30);-webkit-background-clip:text;background-clip:text;color:transparent}
p{color:#A79A87;line-height:1.8;font-size:18px;margin:0 0 10px}
.no{display:inline-block;margin:16px 0 30px;padding:10px 22px;border:1px solid rgba(214,178,110,.3);border-radius:999px;color:#F4E0A8}
.test{background:rgba(214,178,110,.1);border:1px solid rgba(214,178,110,.3);color:#F4E0A8;border-radius:14px;padding:10px 14px;font-size:14px;margin-bottom:22px}
a{display:inline-flex;min-height:52px;align-items:center;padding:14px 34px;border-radius:999px;background:linear-gradient(100deg,#8E6B2E,#E9CD8A 30%,#FFF1C4 45%,#D4AF6A 62%,#8A6A30);color:#1A1208;text-decoration:none;font-weight:500}
</style>
</head>
<body>
<div class="box">
<img class="ok" src="assets/logo.svg" alt="" width="110" height="132">
<div class="test" id="test" hidden>הזמנת בדיקה: לא בוצע חיוב, וההזמנה לא נשלחה לספק.</div>
<h1 id="h">תודה! ההזמנה התקבלה</h1>
<p>אנחנו כבר מתחילים לייצר את המתנה שלכם. אישור יישלח למייל, ותקבלו מספר מעקב ברגע שהחבילה יוצאת.</p>
<div class="no" id="no">מספר הזמנה: …</div><br>
<a href="./">חזרה לחנות</a>
</div>
<script>
const q=new URLSearchParams(location.search);if(q.get('test'))document.getElementById('test').hidden=false;
const id=q.get('o');
if(id)fetch('https://dndqljbibficfscylteq.supabase.co/functions/v1/momento-api',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'status',id})})
 .then(r=>r.json()).then(d=>{if(d.order_no){document.getElementById('no').textContent='מספר הזמנה: #'+(1000+d.order_no);if(d.first_name)document.getElementById('h').textContent='תודה '+d.first_name+'! ההזמנה התקבלה';}}).catch(()=>{});
</script>
</body>
</html>
